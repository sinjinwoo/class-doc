appId: com.classdoc.app
productName: class-doc
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Never package local dev data or repo-only material. class-doc/ in
  # particular is the dev-mode storage root (src/main/paths.ts) and holds a
  # real SQLite DB with student data on a developer machine.
  - '!{class-doc,temp,docs,scripts,img,dist,.claude,.github}/**'
  - '!*.hwpx'
  - '!CLAUDE.md'
asarUnpack:
  - resources/**
  # @rhwp/core is a pure-ESM WASM package loaded via dynamic `import()` from
  # main/rhwp/hwpCore.ts, plus a ~7MB rhwp_bg.wasm read via fs.readFileSync at
  # runtime. Unpacked (rather than left inside app.asar) to sidestep any
  # asar/ESM-loader interplay that isn't verifiable without a packaged build in
  # this task's scope — see the reasoning comment in hwpCore.ts.
  - node_modules/@rhwp/core/**
win:
  executableName: class-doc
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# better-sqlite3 ships an N-API prebuild that works under Electron as-is (see
# CLAUDE.md); a from-source rebuild needs MSVC + Windows SDK and isn't needed.
npmRebuild: false
# Releases are uploaded by .github/workflows/release.yml (electron-builder
# itself always runs with --publish never). The app only *notifies* about
# updates (src/main/updateCheck.ts) — no electron-updater.
publish:
  provider: github
  owner: sinjinwoo
  repo: class-doc
